<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brotinho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap">
<style>
  :root {
    --ground: #FBF6EC; --surface: #FFFFFF; --ink: #3A3630;
    --ink-muted: #8A8375; --accent: #3E6B54; --rule: #E9E2D2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #23211D; --surface: #2C2925; --ink: #EDE7DA;
      --ink-muted: #A8A093; --accent: #8CB68B; --rule: #3B3730;
    }
  }
  :root[data-theme="dark"] {
    --ground: #23211D; --surface: #2C2925; --ink: #EDE7DA;
    --ink-muted: #A8A093; --accent: #8CB68B; --rule: #3B3730;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--ground); color: var(--ink); margin: 0;
    font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
    font-size: 17px; line-height: 1.65; padding: 0 24px 80px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 34rem; margin: 0 auto; }
  header { padding: 72px 0 8px; display: flex; flex-direction: column; gap: 18px; }
  .marca { display: flex; align-items: center; gap: 14px; }
  .marca svg { width: 52px; height: 52px; flex: none; }
  .marca b {
    font-family: 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
    font-weight: 800; font-size: 24px;
  }
  p.sub { margin: 0; color: var(--ink-muted); }
  nav { display: flex; flex-direction: column; gap: 12px; margin-top: 28px; }
  nav a {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; background: var(--surface); border: 1px solid var(--rule);
    border-radius: 14px; padding: 18px 22px; text-decoration: none;
    color: var(--ink); font-weight: 700;
  }
  nav a:hover { border-color: var(--accent); }
  nav a span.seta { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
  footer {
    margin-top: 44px; padding-top: 24px; border-top: 1px solid var(--rule);
    font-size: 15px; color: var(--ink-muted);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="marca">
      <svg viewBox="0 0 100 100" role="img" aria-label="Símbolo do Brotinho">
        <circle cx="50" cy="50" r="49" fill="#EFB183"></circle>
        <path d="M 47.9 88.5 C 47.9 79 48.2 69.5 49.3 63 C 50.2 57.5 52.1 54.4 54.6 52.6"
              fill="none" stroke="#8CB68B" stroke-width="2.2" stroke-linecap="round"></path>
        <g fill="#8CB68B">
          <path d="M 13.7 26.4 C 36.7 26.6 49.1 38.8 49.6 64.6 C 30.7 63.8 12.4 45.8 13.7 26.4 Z"></path>
          <path d="M 13.7 26.4 C 36.7 26.6 49.1 38.8 49.6 64.6 C 30.7 63.8 12.4 45.8 13.7 26.4 Z"
                transform="translate(100 0) scale(-1 1) rotate(-7 13.7 26.4)"></path>
        </g>
      </svg>
      <b>Brotinho</b>
    </div>
    <p class="sub">Um lugar só seu para desabafar.</p>
  </header>

  <nav>
    <a href="suporte.html">Suporte <span class="seta">→</span></a>
    <a href="privacidade.html">Política de privacidade <span class="seta">→</span></a>
  </nav>

  <footer>
    Responsável: Pedro Henrique de Brito Pinto Ferreira<br>
    Contato: brotinho.suporte@gmail.com
  </footer>
</div>
</body>
</html>
